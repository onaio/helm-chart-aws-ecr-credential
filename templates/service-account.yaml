{{- if ne .Values.mode "refresh" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aws-ecr-credential.serviceAccount" . }}
  namespace: {{ include "aws-ecr-credential.namespace" . }}
  labels:
{{ include "aws-ecr-credential.labels" . | indent 4 }}
{{- end }}
{{- if ne .Values.mode "register" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-refresh
  namespace: {{ include "aws-ecr-credential.targetNamespace" . }}
  labels:
{{ include "aws-ecr-credential.labels" . | indent 4 }}
rules:
  # Kubernetes cannot restrict create permissions by resource name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.targetSecret | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["default"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-refresh
  namespace: {{ include "aws-ecr-credential.targetNamespace" . }}
  labels:
{{ include "aws-ecr-credential.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-refresh
subjects:
  - kind: ServiceAccount
    name: {{ include "aws-ecr-credential.serviceAccount" . }}
    namespace: {{ include "aws-ecr-credential.namespace" . }}
{{- end }}
